<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Process Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Process Manager</h2>
        <div>
            <button class="btn btn-sm btn-primary" onclick="refreshProcesses()">🔄 Refresh</button>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6>Total Processes</h6>
                    <h3 id="stat-total">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6>Running</h6>
                    <h3 id="stat-running">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h6>By Scanner</h6>
                    <div id="stat-by-scanner">-</div>
                </div>
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>PID</th>
            <th>Scanner</th>
            <th>Strategy</th>
            <th>IP</th>
            <th>Status</th>
            <th>CPU%</th>
            <th>RAM (MB)</th>
            <th>Uptime</th>
            <th>Command</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="processes-table">
        <tr>
            <td class="text-center" colspan="10">Loading...</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function formatUptime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return `${h}h ${m}m ${s}s`;
    }

    function refreshProcesses() {
        // Stats
        fetch('/api/processes/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('stat-total').textContent = data.total;
                document.getElementById('stat-running').textContent = data.running;
                const byScannerHtml = Object.entries(data.by_scanner)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join('<br>') || 'None';
                document.getElementById('stat-by-scanner').innerHTML = byScannerHtml;
            });

        // Processes
        fetch('/api/processes')
            .then(r => r.json())
            .then(processes => {
                const tbody = document.getElementById('processes-table');
                if (processes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="text-center">No processes</td></tr>';
                    return;
                }

                tbody.innerHTML = processes.map(p => `
                    <tr>
                        <td><code>${p.pid}</code></td>
                        <td><span class="badge bg-primary">${p.scanner}</span></td>
                        <td><small>${p.strategy}</small></td>
                        <td><code>${p.ip}</code></td>
                        <td><span class="badge bg-${p.status === 'running' ? 'success' : 'secondary'}">${p.status}</span></td>
                        <td>${p.cpu_percent ? p.cpu_percent.toFixed(1) : '-'}%</td>
                        <td>${p.memory_mb ? p.memory_mb.toFixed(1) : '-'}</td>
                        <td>${formatUptime(p.uptime_seconds)}</td>
                        <td><small style="max-width: 200px; display: inline-block; overflow: hidden; text-overflow: ellipsis;">${p.cmdline}</small></td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="killProcess('${p.id}')">Kill</button>
                        </td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('processes-table').innerHTML = '<tr><td colspan="10" class="text-danger">Error loading processes</td></tr>';
            });
    }

    function killProcess(processId) {
        if (!confirm(`Kill process ${processId}?`)) return;

        fetch(`/api/processes/${processId}/kill`, {method: 'POST'})
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert('Process killed');
                    refreshProcesses();
                } else {
                    alert('Error: ' + data.error);
                }
            });
    }

    // Auto-refresh every 2 seconds
    setInterval(refreshProcesses, 2000);
    refreshProcesses();
</script>
</body>
</html>
