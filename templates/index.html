<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Scan Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container-fluid p-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center flex-grow-1">Scan Dashboard</h1>
        <button class="btn btn-outline-light" id="dark-mode-toggle" style="position: absolute; right: 15px;">
            <span class="dark-mode-icon">🌙</span> Mode Nuit
        </button>
    </div>
    <div class="mb-4" id="progress-container">
        <div class="mb-2" id="progress-text">En attente...</div>
        <div class="progress">
            <div aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" class="progress-bar" id="progress-bar"
                 role="progressbar" style="width: 0%;"></div>
        </div>
    </div>
    <!-- Conteneur pour les boutons générés dynamiquement -->
    <div class="row row-cols-1 row-cols-md-3 g-3 mb-3" id="scanner-buttons"></div>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="tiles"></div>
</div>

<!-- Popup pour les explications -->
<div aria-hidden="true" aria-labelledby="scannerInfoModalLabel" class="modal fade" id="scannerInfoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scannerInfoModalLabel">Détails du Scanner</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                <div id="scanner-info-content"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Fermer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
<script>
    // Gestion du mode nuit
    const toggleButton = document.getElementById('dark-mode-toggle');
    const body = document.body;
    const icon = toggleButton.querySelector('.dark-mode-icon');

    toggleButton.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        if (body.classList.contains('dark-mode')) {
            icon.textContent = '☀️';
            toggleButton.textContent = ' Mode Jour';
            toggleButton.prepend(icon);
        } else {
            icon.textContent = '🌙';
            toggleButton.textContent = ' Mode Nuit';
            toggleButton.prepend(icon);
        }
        localStorage.setItem('darkMode', body.classList.contains('dark-mode'));
    });

    if (localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark-mode');
        icon.textContent = '☀️';
        toggleButton.textContent = ' Mode Jour';
        toggleButton.prepend(icon);
    }
</script>
</body>
</html>
