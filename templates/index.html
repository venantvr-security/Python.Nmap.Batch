<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Scan Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container-fluid p-3">
    <h1 class="text-center mb-4">Scan Dashboard</h1>
    <div class="mb-4" id="progress-container">
        <div class="mb-2" id="progress-text">En attente...</div>
        <div class="progress">
            <div aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" class="progress-bar" id="progress-bar"
                 role="progressbar" style="width: 0%;"></div>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-3 mb-3" id="scanner-buttons">
        <div class="col">
            <div class="btn-group w-100">
                <button class="btn btn-primary" onclick="startScan('nmap')">Démarrer Nmap</button>
                <button aria-expanded="false" class="btn btn-primary dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" type="button">
                    <span class="visually-hidden">Sélectionner stratégie</span>
                </button>
                <ul class="dropdown-menu" id="nmap-strategies"></ul>
            </div>
        </div>
        <div class="col">
            <div class="btn-group w-100">
                <button class="btn btn-success" onclick="startScan('netcat')">Démarrer Netcat</button>
                <button aria-expanded="false" class="btn btn-success dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" type="button">
                    <span class="visually-hidden">Sélectionner stratégie</span>
                </button>
                <ul class="dropdown-menu" id="netcat-strategies"></ul>
            </div>
        </div>
        <div class="col">
            <div class="btn-group w-100">
                <button class="btn btn-info" onclick="startScan('scapy')">Démarrer Scapy</button>
                <button aria-expanded="false" class="btn btn-info dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" type="button">
                    <span class="visually-hidden">Sélectionner stratégie</span>
                </button>
                <ul class="dropdown-menu" id="scapy-strategies"></ul>
            </div>
        </div>
        <div class="col">
            <div class="btn-group w-100">
                <button class="btn btn-warning" onclick="startScan('masscan')">Démarrer Masscan</button>
                <button aria-expanded="false" class="btn btn-warning dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" type="button">
                    <span class="visually-hidden">Sélectionner stratégie</span>
                </button>
                <ul class="dropdown-menu" id="masscan-strategies"></ul>
            </div>
        </div>
        <div class="col">
            <div class="btn-group w-100">
                <button class="btn btn-secondary" onclick="startScan('hping3')">Démarrer Hping3</button>
                <button aria-expanded="false" class="btn btn-secondary dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" type="button">
                    <span class="visually-hidden">Sélectionner stratégie</span>
                </button>
                <ul class="dropdown-menu" id="hping3-strategies"></ul>
            </div>
        </div>
        <div class="col">
            <div class="d-flex gap-2">
                <button class="btn btn-danger w-50" onclick="stopScan()">Arrêter le scan</button>
                <button class="btn btn-warning w-50" onclick="resetProgress()">Réinitialiser</button>
            </div>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="tiles"></div>
</div>

<!-- Popup pour les explications -->
<div aria-hidden="true" aria-labelledby="scannerInfoModalLabel" class="modal fade" id="scannerInfoModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scannerInfoModalLabel">Détails du Scanner</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                <div id="scanner-info-content"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Fermer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
