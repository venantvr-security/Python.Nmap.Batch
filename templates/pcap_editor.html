<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PCAP Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <style>
        .packet-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .packet-row:hover {
            background-color: rgba(13, 110, 253, 0.1);
        }
        .packet-row.selected {
            background-color: rgba(25, 135, 84, 0.2);
        }
        .packet-row.deleted {
            background-color: rgba(220, 53, 69, 0.2);
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📡 Network Scanner</a>
        <span class="navbar-text text-light">PCAP Editor</span>
        <a class="btn btn-sm btn-outline-light ms-auto" href="/">Back to Dashboard</a>
    </div>
</nav>

<div class="container-fluid p-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="card-title">Upload PCAP</h5>
                    <input accept=".pcap,.pcapng" class="form-control mb-2" id="file-input" type="file">
                    <button class="btn btn-primary w-100" id="upload-btn" onclick="uploadFile()">Upload</button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Existing Files</h5>
                    <div id="existing-files" style="max-height: 400px; overflow-y: auto;">
                        <p class="text-muted">Loading...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Packets</h5>
                        <div>
                            <button class="btn btn-sm btn-success me-2" id="select-all-btn" onclick="selectAll()" disabled>Select All</button>
                            <button class="btn btn-sm btn-warning me-2" id="invert-btn" onclick="invertSelection()" disabled>Invert</button>
                            <button class="btn btn-sm btn-danger" id="delete-btn" onclick="deleteSelected()" disabled>Delete Selected</button>
                        </div>
                    </div>
                    <div id="status" class="alert alert-info" role="alert">
                        No file loaded. Upload a PCAP file to start editing.
                    </div>
                    <div id="packets-table-container" style="display: none;">
                        <table class="table table-sm table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">#</th>
                                    <th>Summary</th>
                                    <th style="width: 100px;">Length</th>
                                    <th style="width: 150px;">Time</th>
                                </tr>
                            </thead>
                            <tbody id="packets-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-3" id="save-section" style="display: none;">
                <div class="card-body">
                    <h5 class="card-title">Save Edited PCAP</h5>
                    <div class="row">
                        <div class="col-md-8">
                            <input class="form-control" id="save-filename" placeholder="filename.pcap" type="text">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-success w-100" onclick="saveFile()">Save to pcap_templates/packets/</button>
                        </div>
                    </div>
                    <small class="text-muted">Selected packets: <span id="selected-count">0</span> / <span id="total-count">0</span></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentFile = null;
let packets = [];
let selectedIndices = new Set();
let deletedIndices = new Set();

function loadExistingFiles() {
    fetch('/api/pcap/list')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('existing-files');
            if (data.files.length === 0) {
                container.innerHTML = '<p class="text-muted">No files found</p>';
                return;
            }
            container.innerHTML = data.files.map(f => `
                <div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded"
                     style="cursor: pointer;"
                     onclick="loadExistingFile('${f.filename}')">
                    <div>
                        <div class="fw-bold">${f.filename}</div>
                        <small class="text-muted">${(f.size / 1024).toFixed(1)} KB</small>
                    </div>
                    <span class="text-primary">👁️</span>
                </div>
            `).join('');
        });
}

function loadExistingFile(filename) {
    document.getElementById('status').textContent = 'Loading ' + filename + '...';
    document.getElementById('status').className = 'alert alert-info';

    fetch('/api/pcap/load/' + encodeURIComponent(filename))
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                document.getElementById('status').className = 'alert alert-danger';
                document.getElementById('status').textContent = 'Error: ' + data.error;
                return;
            }

            currentFile = data;
            packets = data.packets;
            selectedIndices.clear();
            deletedIndices.clear();

            renderPackets();
            document.getElementById('status').className = 'alert alert-success';
            document.getElementById('status').textContent = `Loaded ${data.packet_count} packets from ${data.filename}`;
            document.getElementById('packets-table-container').style.display = 'block';
            document.getElementById('save-section').style.display = 'block';
            document.getElementById('save-filename').value = data.filename.replace(/\.(pcap|pcapng)$/, '_edited.pcap');
            document.getElementById('select-all-btn').disabled = false;
            document.getElementById('invert-btn').disabled = false;
            document.getElementById('delete-btn').disabled = false;
            updateCounts();
        })
        .catch(err => {
            document.getElementById('status').className = 'alert alert-danger';
            document.getElementById('status').textContent = 'Load failed: ' + err;
        });
}

function uploadFile() {
    const fileInput = document.getElementById('file-input');
    if (!fileInput.files.length) {
        alert('Please select a file');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    document.getElementById('status').textContent = 'Uploading...';

    fetch('/api/pcap/upload', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            document.getElementById('status').className = 'alert alert-danger';
            document.getElementById('status').textContent = 'Error: ' + data.error;
            return;
        }

        currentFile = data;
        packets = data.packets;
        selectedIndices.clear();
        deletedIndices.clear();

        renderPackets();
        document.getElementById('status').className = 'alert alert-success';
        document.getElementById('status').textContent = `Loaded ${data.packet_count} packets from ${data.filename}`;
        document.getElementById('packets-table-container').style.display = 'block';
        document.getElementById('save-section').style.display = 'block';
        document.getElementById('save-filename').value = data.filename.replace(/\.(pcap|pcapng)$/, '_edited.pcap');
        document.getElementById('select-all-btn').disabled = false;
        document.getElementById('invert-btn').disabled = false;
        document.getElementById('delete-btn').disabled = false;
        updateCounts();
    })
    .catch(err => {
        document.getElementById('status').className = 'alert alert-danger';
        document.getElementById('status').textContent = 'Upload failed: ' + err;
    });
}

function renderPackets() {
    const tbody = document.getElementById('packets-table');
    tbody.innerHTML = packets.map((pkt, i) => {
        const classes = [];
        if (selectedIndices.has(i)) classes.push('selected');
        if (deletedIndices.has(i)) classes.push('deleted');

        return `
            <tr class="packet-row ${classes.join(' ')}" onclick="togglePacket(${i})">
                <td>${i}</td>
                <td>${pkt.summary}</td>
                <td>${pkt.length} bytes</td>
                <td>${new Date(pkt.time * 1000).toLocaleTimeString()}</td>
            </tr>
        `;
    }).join('');
}

function togglePacket(index) {
    if (deletedIndices.has(index)) return;

    if (selectedIndices.has(index)) {
        selectedIndices.delete(index);
    } else {
        selectedIndices.add(index);
    }
    renderPackets();
    updateCounts();
}

function selectAll() {
    selectedIndices.clear();
    for (let i = 0; i < packets.length; i++) {
        if (!deletedIndices.has(i)) {
            selectedIndices.add(i);
        }
    }
    renderPackets();
    updateCounts();
}

function invertSelection() {
    const newSelected = new Set();
    for (let i = 0; i < packets.length; i++) {
        if (!deletedIndices.has(i) && !selectedIndices.has(i)) {
            newSelected.add(i);
        }
    }
    selectedIndices = newSelected;
    renderPackets();
    updateCounts();
}

function deleteSelected() {
    if (selectedIndices.size === 0) {
        alert('No packets selected');
        return;
    }

    selectedIndices.forEach(i => deletedIndices.add(i));
    selectedIndices.clear();
    renderPackets();
    updateCounts();
}

function updateCounts() {
    const remaining = packets.length - deletedIndices.size;
    document.getElementById('selected-count').textContent = selectedIndices.size;
    document.getElementById('total-count').textContent = remaining;
}

function saveFile() {
    const filename = document.getElementById('save-filename').value.trim();
    if (!filename) {
        alert('Please enter a filename');
        return;
    }

    // Indices à garder (ni deleted)
    const keepIndices = [];
    for (let i = 0; i < packets.length; i++) {
        if (!deletedIndices.has(i)) {
            keepIndices.push(i);
        }
    }

    fetch('/api/pcap/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            temp_path: currentFile.temp_path,
            filename: filename,
            selected_indices: Array.from(keepIndices)
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            alert('Error: ' + data.error);
            return;
        }
        alert(`Saved ${data.packet_count} packets to ${data.filename}`);
        loadExistingFiles();
    })
    .catch(err => alert('Save failed: ' + err));
}

document.addEventListener('DOMContentLoaded', () => {
    loadExistingFiles();
});
</script>
</body>
</html>
