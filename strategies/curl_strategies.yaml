strategies:
  quick-http-head-check:
    - "-s"                # Mode silencieux, pas de sortie inutile
    - "-I"                # Requête HEAD uniquement (en-têtes)
    - "--connect-timeout" # Définit le timeout de connexion
    - "2"                 # Timeout de connexion à 2 secondes
    - "-m"                # Temps maximum total de l'opération
    - "5"                 # Temps max fixé à 5 secondes
    - "http://<ip>:<ports>"  # URL cible avec ports dynamiques
  quick-https-head-check:
    - "-s"                # Mode silencieux, pas de sortie inutile
    - "-I"                # Requête HEAD uniquement (en-têtes)
    - "--connect-timeout" # Définit le timeout de connexion
    - "2"                 # Timeout de connexion à 2 secondes
    - "-m"                # Temps maximum total de l'opération
    - "5"                 # Temps max fixé à 5 secondes
    - "https://<ip>:<ports>" # URL cible en HTTPS avec ports dynamiques
  verbose-custom-port-scan:
    - "-v"                # Mode verbeux, affiche des détails
    - "-I"                # Requête HEAD uniquement (en-têtes)
    - "--connect-timeout" # Définit le timeout de connexion
    - "1"                 # Timeout de connexion à 1 seconde
    - "-m"                # Temps maximum total de l'opération
    - "3"                 # Temps max fixé à 3 secondes
    - "http://<ip>:<ports>"  # URL cible avec ports dynamiques