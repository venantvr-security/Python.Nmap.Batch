strategies:
  verbose-os-port-scan:
    - "-v"          # Mode verbeux, affiche plus de détails
    - "-O"          # Détection du système d’exploitation
    - "-p"          # Spécifie les ports à scanner
    - "<ports>"     # Ports ciblés : FTP (21), SSH (22), HTTP (80), HTTPS (443)
  verbose-service-os-syn:
    - "-v"          # Mode verbeux, affiche plus de détails
    - "-sV"         # Détection des versions des services
    - "-O"          # Détection du système d’exploitation
    - "-sS"         # Scan SYN (furtif, ne complète pas la connexion TCP)
    - "-p"          # Spécifie les ports à scanner
    - "<ports>"     # Balaye les ports de 1 à 1000
  verbose-vuln-os-service:
    - "-v"          # Mode verbeux, affiche plus de détails
    - "-sV"         # Détection des versions des services
    - "-O"          # Détection du système d’exploitation
    - "--script"    # Exécute un script NSE (Nmap Scripting Engine)
    - "vuln"        # Script pour détecter les vulnérabilités connues
    - "-p"          # Spécifie les ports à scanner
    - "<ports>"     # Balaye les ports de 1 à 1000
  stealth-syn-fragmented-polite:
    - "-v"          # Mode verbeux, affiche plus de détails
    - "-sS"         # Scan SYN (furtif, ne complète pas la connexion TCP)
    - "-f"          # Fragmente les paquets pour éviter la détection
    - "-p"          # Spécifie les ports à scanner
    - "<ports>"     # Ports ciblés : HTTP (80), HTTPS (443)
    - "-T2"         # Timing T2, discret et plus lent pour éviter la détection
  stealth-http-headers-fragmented:
    - "-v"          # Mode verbeux, affiche plus de détails
    - "-sS"         # Scan SYN (furtif, ne complète pas la connexion TCP)
    - "-f"          # Fragmente les paquets pour éviter la détection
    - "-p"          # Spécifie les ports à scanner
    - "-T2"         # Timing T2, discret et plus lent pour éviter la détection
    - "<ports>"     # Ports ciblés : HTTP (80), HTTPS (443)
    - "--script"    # Exécute un script NSE
    - "http-headers" # Récupère les en-têtes HTTP des services détectés
    - "--script-args" # Arguments passés au script
    - "http.useragent=\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36\"" # Falsifie l’agent utilisateur
  stealth-fragmented-custom-mtu:
    - "-v"           # Mode verbeux, affiche plus de détails
    - "-sS"          # Scan SYN (furtif, ne complète pas la connexion TCP)
    - "-f"           # Fragmente les paquets pour éviter la détection
    - "--mtu"        # Définit la taille maximale des fragments
    - "24"           # MTU de 24 octets pour une fragmentation fine
    - "--data-length" # Ajoute des données supplémentaires aux paquets
    - "32"           # 32 octets de données pour brouiller l’analyse
    - "-p"           # Spécifie les ports à scanner
    - "<ports>"      # Ports ciblés : HTTP (80), HTTPS (443)
    - "-T2"          # Timing T2, discret et plus lent pour éviter la détection
  stealth-slow-decoy-scan: # Conservé tel quel (ChatGPT)
    - "-sS"           # Scan SYN furtif
    - "-Pn"           # Pas de ping préalable
    - "-T2"           # Timing Polite
    - "--scan-delay"  # Délai entre paquets
    - "5s"            # 5 secondes de délai
    - "--max-rate"    # Taux maximum de paquets
    - "1"             # 1 paquet par seconde
    - "-f"            # Fragmentation des paquets
    - "-D"            # Leurres (decoys)
    - "RND:10"        # 10 adresses leurres aléatoires
  ultra-stealth-paranoid-scan: # Conservé tel quel (Grok)
    - "-sS"  # Scan SYN furtif
    - "-T0"  # Timing Paranoid (5 minutes entre chaque paquet)
    - "-p"
    - "<ports>"
  decoy-random-ipid-spoof:
    - "-sS"
    - "-Pn"
    - "-D"
    - "RND:15"
    - "--randomize-hosts"
    - "-T3"
    - "-p"
    - "<ports>"
    - "--data-length"
    - "25"
  mac-spoof-variable-timing:
    - "-sS"
    - "-Pn"
    - "--spoof-mac"
    - "0"
    - "--scan-delay"
    - "2s-5s"
    - "-T2"
    - "-p"
    - "<ports>"
  source-ip-spoof:
    - "-sS"
    - "-Pn"
    - "-S"
    - "192.0.2.1"
    - "-e"
    - "eth0"
    - "--disable-arp-ping"
    - "-p"
    - "<ports>"
  extreme-fragmentation:
    - "-sS"
    - "-f"
    - "-f"
    - "--mtu"
    - "8"
    - "-T1"
    - "-p"
    - "<ports>"
  badsum-bypass:
    - "-sS"
    - "--badsum"
    - "-Pn"
    - "-p"
    - "<ports>"
  ttl-manipulation:
    - "-sS"
    - "--ttl"
    - "64"
    - "--randomize-hosts"
    - "-T2"
    - "-p"
    - "<ports>"
  fin-scan-fragmented:
    - "-sF"
    - "-f"
    - "-T2"
    - "--randomize-hosts"
    - "-p"
    - "<ports>"
  xmas-decoy:
    - "-sX"
    - "-D"
    - "RND:20"
    - "-T1"
    - "-p"
    - "<ports>"
  null-paranoid:
    - "-sN"
    - "-T0"
    - "--max-rate"
    - "0.5"
    - "-p"
    - "<ports>"
  ack-firewall-map:
    - "-sA"
    - "--randomize-hosts"
    - "-T3"
    - "-p"
    - "<ports>"
  window-scan-decoy:
    - "-sW"
    - "-D"
    - "RND:12"
    - "-T2"
    - "-p"
    - "<ports>"
  ipv6-stealth:
    - "-6"
    - "-sS"
    - "-T2"
    - "--randomize-hosts"
    - "-p"
    - "<ports>"
  maimon-scan:
    - "-sM"
    - "-T1"
    - "--scan-delay"
    - "3s"
    - "-p"
    - "<ports>"